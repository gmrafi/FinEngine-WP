<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" shape-rendering="crispEdges">
  <!-- Solid White Canvas with Sharp Minimalist Border -->
  <rect x="16" y="16" width="480" height="480" rx="16" fill="#FFFFFF" stroke="#0F172A" stroke-width="12"/>
  
  <!-- 4 Symmetrical Architectural Precision Tiles -->
  <g transform="translate(64, 64)">
    
    <!-- Top-Left: Addition (+) in Royal Blue -->
    <rect x="0" y="0" width="180" height="180" rx="8" fill="#1D4ED8"/>
    <rect x="76" y="36" width="28" height="108" fill="#FFFFFF"/>
    <rect x="36" y="76" width="108" height="28" fill="#FFFFFF"/>

    <!-- Top-Right: Percentage (%) in Pine Green -->
    <rect x="204" y="0" width="180" height="180" rx="8" fill="#165B44"/>
    <circle cx="250" cy="50" r="18" fill="#FFFFFF"/>
    <polygon points="230,140 248,140 338,40 320,40" fill="#FFFFFF"/>
    <circle cx="338" cy="130" r="18" fill="#FFFFFF"/>

    <!-- Bottom-Left: Division (÷) in Dark Slate -->
    <rect x="0" y="204" width="180" height="180" rx="8" fill="#0F172A"/>
    <circle cx="90" cy="248" r="18" fill="#FFFFFF"/>
    <rect x="36" y="280" width="108" height="28" fill="#FFFFFF"/>
    <circle cx="90" cy="340" r="18" fill="#FFFFFF"/>

    <!-- Bottom-Right: Equals (=) in Pine Green -->
    <rect x="204" y="204" width="180" height="180" rx="8" fill="#165B44"/>
    <rect x="240" y="266" width="108" height="24" fill="#FFFFFF"/>
    <rect x="240" y="302" width="108" height="24" fill="#FFFFFF"/>

  </g>
</svg>
